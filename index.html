    <meta charset="UTF-8">

    <title>Community</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            color: #262626;
        }


        /* =========================
           TOP NAVIGATION
        ========================= */

        .navbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #dbdbdb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            position: sticky;
            top: 0;
            z-index: 100;
        }


        .logo {
            font-size: 22px;
            font-weight: 700;
        }


        .nav-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }


        .nav-button {
            border: none;
            background: none;
            font-size: 15px;
            cursor: pointer;
        }


        /* =========================
           MAIN PAGE
        ========================= */

        .page {
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
            padding-bottom: 50px;
        }


        /* =========================
           STORIES
        ========================= */

        .stories-container {
            background: white;
            border: 1px solid #dbdbdb;
            margin-top: 20px;
            padding: 18px 45px;
            position: relative;
            overflow: hidden;
        }


        .stories {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }


        .stories::-webkit-scrollbar {
            display: none;
        }


        .story {
            min-width: 75px;
            text-align: center;
            cursor: pointer;
        }


        .story-ring {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            padding: 3px;
            margin: 0 auto 5px;

            background: linear-gradient(
                45deg,
                #feda75,
                #fa7e1e,
                #d62976,
                #962fbf,
                #4f5bd5
            );
        }


        .story-ring.seen {
            background: #c7c7c7;
        }


        .story-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
            background: #ddd;
        }


        .story-name {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .add-story {
            position: relative;
        }


        .add-icon {
            position: absolute;
            bottom: 1px;
            right: 2px;
            background: #0095f6;
            color: white;
            width: 21px;
            height: 21px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid white;
            font-size: 15px;
            font-weight: bold;
        }


        .story-arrow {
            position: absolute;
            top: 38px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: white;
            box-shadow: 0 2px 7px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 2;
            font-size: 18px;
        }


        .story-arrow.left {
            left: 10px;
        }


        .story-arrow.right {
            right: 10px;
        }


        /* =========================
           POSTS
        ========================= */

        .feed {
            margin-top: 25px;
        }


        .post {
            background: white;
            border: 1px solid #dbdbdb;
            margin-bottom: 25px;
        }


        .post-header {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            gap: 10px;
        }


        .post-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }


        .post-user-info {
            flex: 1;
        }


        .post-username {
            font-weight: 600;
            font-size: 14px;
        }


        .post-character {
            color: #777;
            font-size: 12px;
        }


        .more-button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }


        .post-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #eee;
        }


        .post-actions {
            padding: 10px 15px 5px;
            display: flex;
            gap: 16px;
        }


        .action-button {
            border: none;
            background: none;
            font-size: 25px;
            cursor: pointer;
            padding: 0;
        }


        .action-button.liked {
            color: #ed4956;
        }


        .likes {
            padding: 0 15px;
            font-weight: 600;
            font-size: 14px;
        }


        .caption {
            padding: 7px 15px;
            font-size: 14px;
            line-height: 1.4;
            color: #61A9C2;
        }


        .caption strong {
            margin-right: 5px;
        }


        .comments {
            padding: 0 15px;
        }


        .comment {
            margin-bottom: 6px;
            font-size: 14px;
        }


        .comment strong {
            margin-right: 5px;
        }


        .timestamp {
            color: #999;
            font-size: 10px;
            text-transform: uppercase;
            padding: 8px 15px 12px;
        }


        .comment-form {
            display: flex;
            border-top: 1px solid #efefef;
            padding: 10px 15px;
        }


        .comment-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
        }


        .comment-submit {
            border: none;
            background: none;
            color: #0095f6;
            font-weight: 600;
            cursor: pointer;
        }


        /* =========================
           STORY VIEWER
        ========================= */

        .story-viewer {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }


        .story-viewer.active {
            display: flex;
        }


        .story-content {
            width: min(420px, 90vw);
            height: min(750px, 90vh);
            background: #222;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }


        .story-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }


        .story-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 18px;
            color: white;
            background: linear-gradient(
                rgba(0,0,0,0.5),
                transparent
            );
            pointer-events: none;
        }


        .story-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .story-profile img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
        }


        .close-story {
            position: absolute;
            right: 15px;
            top: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            z-index: 2;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .page {
                width: 100%;
            }


            .stories-container {
                border-left: none;
                border-right: none;
            }


            .post {
                border-left: none;
                border-right: none;
            }


            .navbar {
                padding: 0 15px;
            }

        }

                </form>

            `;


            feed.appendChild(postElement);

        });



        /* =====================================================
           COMMENTS
        ===================================================== */

        function renderComments(comments) {

            return comments.map(comment => `

                <div class="comment">

                    <strong>
                        ${comment.username}
                    </strong>

                    ${comment.text}

                </div>

            `).join("");

        }



        function addComment(event, index) {

            event.preventDefault();


            const input =
                document.getElementById(
                    `comment-input-${index}`
                );


            const text =
                input.value.trim();


            if (!text) {
                return;
            }


            posts[index].comments.push({

                username: "you",

                text: text

            });


            document.getElementById(
                `comments-${index}`
            ).innerHTML =
                renderComments(
                    posts[index].comments
                );


            input.value = "";

        }



        /* =====================================================
           LIKES
        ===================================================== */

        function likePost(index, button) {

            const post =
                posts[index];


            if (
                button.classList.contains("liked")
            ) {

                post.likes--;

                button.classList.remove(
                    "liked"
                );

                button.innerHTML = "♡";

            } else {

                post.likes++;

                button.classList.add(
                    "liked"
                );

                button.innerHTML = "♥";

            }


            document.getElementById(
                `likes-${index}`
            ).textContent =
                `${post.likes} likes`;

        }



        /* =====================================================
           COMMENT BUTTON
        ===================================================== */

        function focusComment(index) {

            const input =
                document.getElementById(
                    `comment-input-${index}`
                );


            if (input) {
                input.focus();
            }

        }



        /* =====================================================
           SHARE BUTTON
        ===================================================== */

        function sharePost() {

            alert(":3");

        }



        /* =====================================================
           STORY CAROUSEL
        ===================================================== */

        function scrollStories(amount) {

            const stories =
                document.getElementById("stories");


            if (stories) {

                stories.scrollBy({

                    left: amount,

                    behavior: "smooth"

                });

            }

        }



        /* =====================================================
           STORY VIEWER
        ===================================================== */

        let currentStoryImages = [];

        let currentStoryIndex = 0;



        function openStory(
            username,
            images,
            avatar
        ) {

            currentStoryImages = images;

            currentStoryIndex = 0;


            document.getElementById(
                "storyUsername"
            ).textContent =
                username;


            document.getElementById(
                "storyAvatar"
            ).src =
                avatar;


            document.getElementById(
                "storyImage"
            ).src =
                currentStoryImages[
                    currentStoryIndex
                ];


            document.getElementById(
                "storyViewer"
            ).classList.add(
                "active"
            );

        }



        /* =====================================================
           NEXT STORY IMAGE
        ===================================================== */

        function nextStoryImage(event) {

            event.stopPropagation();


            if (
                currentStoryImages.length === 0
            ) {

                return;

            }


            currentStoryIndex++;


            if (
                currentStoryIndex >=
                currentStoryImages.length
            ) {

                currentStoryIndex = 0;

            }


            document.getElementById(
                "storyImage"
            ).src =
                currentStoryImages[
                    currentStoryIndex
                ];

        }



        /* =====================================================
           CLOSE STORY
        ===================================================== */

        function closeStory(event) {

            if (
                !event ||
                event.target.id ===
                "storyViewer"
            ) {

                document.getElementById(
                    "storyViewer"
                ).classList.remove(
                    "active"
                );

            }

        }

    </script>
